[project]
name = "ges2t"
version = "0.1.0"
description = "Good enough speech 2 text: fully offline dictation that types into the focused window."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cactus-needle==3.1.3",
    "pystray",
    "pillow",
]

[project.scripts]
ges2t = "ges2t.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
